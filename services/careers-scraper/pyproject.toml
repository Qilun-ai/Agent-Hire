[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "company-careers-scraper"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Auditable, complete-description collection from company career sites"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5,<7",
    "pypdf>=6",
]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.12,<1"]

[project.scripts]
careers = "career_scraper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/career_scraper"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

