<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apply — Backend Engineer · Contoso Cloud</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 720px; margin: 32px auto; padding: 0 16px; color: #222; }
  .field { margin: 16px 0; } .lbl { display: block; font-weight: 600; margin-bottom: 4px; }
  input[type=text], input[type=email], input[type=tel], input[type=number], input[type=date] { padding: 7px; width: 100%; box-sizing: border-box; }
  .combo { position: relative; } .combo input { width: 100%; padding: 7px; box-sizing: border-box; }
  .menu { position: absolute; left: 0; right: 0; background: #fff; border: 1px solid #aaa; z-index: 2; max-height: 180px; overflow: auto; }
  .menu [role=option] { padding: 6px 8px; cursor: pointer; } .menu [role=option]:hover { background: #eef; }
  .yn button { padding: 6px 18px; border: 1px solid #888; background: #fff; border-radius: 4px; cursor: pointer; }
  .yn button[aria-pressed=true] { background: #2b5cff; color: #fff; }
  .drop { border: 2px dashed #999; padding: 18px; text-align: center; border-radius: 8px; cursor: pointer; }
  .phone { display: flex; gap: 8px; } .phone select { width: 110px; }
</style>
</head>
<body>
<h1>Backend Engineer</h1>
<p>Contoso Cloud · Remote (India)</p>
<form id="app" onsubmit="event.preventDefault(); document.getElementById('submitted').textContent='SUBMITTED'">

  <div class="field"><label class="lbl" for="name">Full name</label><input type="text" id="name" name="name"></div>
  <div class="field"><label class="lbl" for="mail">Email</label><input type="email" id="mail" name="email"></div>

  <!-- Split phone: country code select + number -->
  <div class="field"><span class="lbl" id="ph">Phone number</span>
    <div class="phone">
      <select aria-label="Country code" name="phone_cc"><option value="">Code</option><option value="+1">+1 (US)</option><option value="+44">+44 (UK)</option><option value="+91">+91 (IN)</option></select>
      <input type="tel" aria-labelledby="ph" name="phone_number">
    </div></div>

  <!-- React-Select style combobox: typing filters, an option must be clicked; the hidden input holds the value -->
  <div class="field"><label class="lbl" id="country-l" for="country-input">Country of residence</label>
    <div class="combo" id="country">
      <input id="country-input" type="text" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="country-menu" aria-labelledby="country-l" autocomplete="off" placeholder="Select...">
      <div class="menu" id="country-menu" role="listbox" hidden></div>
      <input type="hidden" name="country" id="country-value">
    </div></div>

  <!-- Ashby style Yes/No buttons -->
  <div class="field"><span class="lbl" id="spon-l">Will you now or in the future require visa sponsorship to work in India?</span>
    <div class="yn" role="group" aria-labelledby="spon-l">
      <button type="button" aria-pressed="false" data-v="Yes">Yes</button>
      <button type="button" aria-pressed="false" data-v="No">No</button>
      <input type="hidden" name="sponsorship" id="spon-value">
    </div></div>

  <!-- Checkbox group (multi-select) -->
  <fieldset class="field"><legend class="lbl">Which languages can you work in?</legend>
    <label><input type="checkbox" name="lang" value="en"> English</label>
    <label><input type="checkbox" name="lang" value="hi"> Hindi</label>
    <label><input type="checkbox" name="lang" value="ta"> Tamil</label>
    <label><input type="checkbox" name="lang" value="kn"> Kannada</label>
  </fieldset>

  <div class="field"><label class="lbl" for="start">Earliest start date</label><input type="date" id="start" name="start_date"></div>
  <div class="field"><label class="lbl" for="yrs">Years of professional experience</label><input type="number" id="yrs" name="years" min="0" max="50"></div>

  <!-- Hidden file input behind a drop zone -->
  <div class="field"><span class="lbl">Resume</span>
    <label class="drop" for="cv">Drop your resume here or click to upload<input type="file" id="cv" name="resume" accept=".pdf" style="display:none"></label>
    <div id="cv-name"></div></div>

  <button type="submit">Submit</button>
  <p id="submitted"></p>
</form>
<script>
  const COUNTRIES = ['Australia', 'Canada', 'Germany', 'India', 'Singapore', 'United Kingdom', 'United States'];
  const input = document.getElementById('country-input'), menu = document.getElementById('country-menu'), hidden = document.getElementById('country-value');
  function render(filter) {
    menu.innerHTML = '';
    for (const c of COUNTRIES.filter((c) => c.toLowerCase().includes((filter || '').toLowerCase()))) {
      const o = document.createElement('div'); o.setAttribute('role', 'option'); o.textContent = c;
      o.addEventListener('mousedown', (e) => { e.preventDefault(); hidden.value = c; input.value = c; close(); });
      menu.appendChild(o);
    }
  }
  function open() { render(input.value === hidden.value ? '' : input.value); menu.hidden = false; input.setAttribute('aria-expanded', 'true'); }
  function close() { menu.hidden = true; input.setAttribute('aria-expanded', 'false'); }
  input.addEventListener('focus', open); input.addEventListener('click', open);
  input.addEventListener('input', () => { render(input.value); menu.hidden = false; });
  // Like React-Select: leaving without choosing an option resets the text to the chosen value.
  input.addEventListener('blur', () => { close(); input.value = hidden.value; });

  for (const b of document.querySelectorAll('.yn button')) b.addEventListener('click', () => {
    for (const x of b.parentElement.querySelectorAll('button')) x.setAttribute('aria-pressed', String(x === b));
    document.getElementById('spon-value').value = b.dataset.v;
  });
  document.getElementById('cv').addEventListener('change', (e) => { document.getElementById('cv-name').textContent = [...e.target.files].map((f) => f.name).join(', '); });
</script>
</body>
</html>
